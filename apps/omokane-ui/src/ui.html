<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AxiomGraph（思兼 / OMOIKANE）現場確認UI</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --ok: #22c55e; --warn: #f59e0b; --err: #ef4444; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 18px; }
    h1 { font-size: 1.3rem; margin: 0; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { background: var(--card); color: var(--text); border: 1px solid #334155; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .tab-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
    .panel { display: none; background: var(--card); border-radius: 10px; padding: 16px; border: 1px solid #334155; }
    .panel.active { display: block; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #334155; font-size: 0.9rem; }
    .badge { padding: 2px 8px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
    .badge-ok { background: #14532d; color: #86efac; }
    .badge-warn { background: #78350f; color: #fde68a; }
    .badge-err { background: #7f1d1d; color: #fca5a5; }
    button.action-btn { background: var(--accent); color: #0f172a; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button.reject-btn { background: var(--err); color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-left: 6px; }
    pre { background: #0f172a; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 0.82rem; }
  </style>
</head>
<body>
  <header>
    <h1>AxiomGraph（思兼 / OMOIKANE）v0.1</h1>
    <div id="inbox-status" style="color: var(--muted); font-size: 0.85rem;">Loading...</div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab(0)">1. データ取込・PCFGマッピング</button>
    <button class="tab-btn" onclick="showTab(1)">2. 不整合検知ビュー</button>
    <button class="tab-btn" onclick="showTab(2)">3. Action承認・Write-back・監査ログ</button>
  </div>

  <div class="panel active" id="tab-0">
    <h3>PCFG スキーマ自律解消結果</h3>
    <table>
      <thead><tr><th>列</th><th>元ヘッダ</th><th>状態</th><th>推定属性 / 候補選択</th><th>信頼度</th><th>操作</th></tr></thead>
      <tbody id="pcfg-tbody"></tbody>
    </table>
  </div>

  <div class="panel" id="tab-1">
    <h3>LadybugDB + DataFusion 4大不整合検知</h3>
    <table>
      <thead><tr><th>種別</th><th>重要度</th><th>対象</th><th>影響経路</th><th>詳細</th></tr></thead>
      <tbody id="inc-tbody"></tbody>
    </table>
  </div>

  <div class="panel" id="tab-2">
    <h3>CFG拘束・Dry-run差分確認・Wasmtime Write-back</h3>
    <div id="actions-list"></div>
    <h3 style="margin-top:24px;">ハッシュ連鎖付き監査ログ (SHA-256)</h3>
    <pre id="audit-pre"></pre>
  </div>

  <script>
    const ATTRS = ["part_number","parent_part_number","part_name","quantity","drawing_id","revision","status"];
    function showTab(i) {
      document.querySelectorAll('.tab-btn').forEach((b, idx) => b.classList.toggle('active', idx === i));
      document.querySelectorAll('.panel').forEach((p, idx) => p.classList.toggle('active', idx === i));
    }
    async function refreshAll() {
      const st = await (await fetch('/api/status')).json();
      document.getElementById('inbox-status').textContent = `Inbox: ${st.inbox_dir} | ERP Version: v${st.erp_version} | Parts: ${st.parts_count}`;

      const pcfg = await (await fetch('/api/pcfg')).json();
      const ptbody = document.getElementById('pcfg-tbody');
      ptbody.innerHTML = pcfg.map(c => {
        if (c.status === 'resolved') {
          return `<tr><td>${c.column_index}</td><td>${c.raw_header}</td><td><span class="badge badge-ok">Resolved</span></td><td>${c.attr}</td><td>${(c.confidence*100).toFixed(1)}%</td><td>-</td></tr>`;
        } else {
          const opts = ATTRS.map(a => `<option value="${a}">${a}</option>`).join('');
          return `<tr><td>${c.column_index}</td><td>${c.raw_header}</td><td><span class="badge badge-warn">Unknown</span></td><td><select id="sel-${c.column_index}">${opts}</select></td><td>${c.reason}</td><td><button class="action-btn" onclick="submitFeedback(${c.column_index}, '${c.raw_header}')">確定して再スコア</button></td></tr>`;
        }
      }).join('');

      const incs = await (await fetch('/api/inconsistencies')).json();
      document.getElementById('inc-tbody').innerHTML = incs.map(i =>
        `<tr><td>${i.kind}</td><td><span class="badge badge-err">${i.severity}</span></td><td>${i.entity_id}</td><td>${i.path.join(' → ')}</td><td>${i.description}</td></tr>`
      ).join('');

      const acts = await (await fetch('/api/actions')).json();
      document.getElementById('actions-list').innerHTML = acts.map(a => `
        <div style="border:1px solid #334155; padding:12px; border-radius:8px; margin-bottom:12px;">
          <div><strong>${a.action_id}</strong> — <span class="badge badge-warn">${a.status}</span></div>
          <pre>Before: ${JSON.stringify(a.diff.before, null, 2)}\nAfter:  ${JSON.stringify(a.diff.after, null, 2)}</pre>
          ${a.status === 'PENDING_APPROVAL' ? `<button class="action-btn" onclick="approveAct('${a.action_id}')">承認して実行 (Wasmtime)</button><button class="reject-btn" onclick="rejectAct('${a.action_id}')">却下</button>` : ''}
        </div>
      `).join('');

      const audit = await (await fetch('/api/audit')).json();
      document.getElementById('audit-pre').textContent = audit.map(e => JSON.stringify(e)).join('\n');
    }
    async function submitFeedback(colIdx, rawHeader) {
      const attr = document.getElementById(`sel-${colIdx}`).value;
      await fetch('/api/pcfg/feedback', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ column_index: colIdx, raw_header: rawHeader, chosen_attr: attr }) });
      await refreshAll();
    }
    async function approveAct(id) {
      await fetch('/api/actions/approve', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ action_id: id, approver: 'tanaka' }) });
      await refreshAll();
    }
    async function rejectAct(id) {
      await fetch('/api/actions/reject', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ action_id: id, approver: 'tanaka' }) });
      await refreshAll();
    }
    refreshAll();
  </script>
</body>
</html>
